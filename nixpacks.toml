# Coolify v4 / Nixpacks — pnpm monorepo (Vite + API server, not Next.js).
# ERR_UNKNOWN_BUILTIN_MODULE: do NOT use corepack or default Nixpacks pnpm — use bootstrap-pnpm-ci.sh.
# Do NOT set NODE_ENV=production globally: pnpm skips devDependencies (Vite/esbuild) needed to build.
# Coolify: leave Install/Build/Start commands empty so this file is used.

providers = ["node"]

[variables]
NIXPACKS_NODE_VERSION = "20"

[phases.setup]
nixPkgs = ["curl"]

[phases.install]
cmds = ["sh ./scripts/bootstrap-pnpm-ci.sh"]

[phases.build]
cmds = ["npm run build:docker"]

[start]
cmd = "NODE_ENV=production node ./scripts/src/docker-start.mjs"
