# Coolify v4 / Nixpacks — avoid default `npm i -g corepack` (EBADENGINE on some Node 20 images).
# Setup: Node 20 + pnpm from nixpkgs only. Install: plain pnpm (no corepack, no frozen lockfile).
# Do NOT set NODE_ENV=production globally — pnpm would skip devDependencies (Vite/esbuild).
# Coolify: clear custom Install/Build/Start commands so this file is used.

providers = ["node"]

[variables]
NIXPACKS_NODE_VERSION = "20"
NPM_CONFIG_PRODUCTION = "false"

[phases.setup]
nixPkgs = ["nodejs_20", "pnpm"]
cmds = ["node --version", "pnpm --version"]

[phases.install]
cmds = ["pnpm install --no-frozen-lockfile"]

[phases.build]
cmds = ["npm run build:docker"]

[start]
cmd = "NODE_ENV=production node ./scripts/src/docker-start.mjs"
